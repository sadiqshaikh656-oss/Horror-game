<!doctype html><html><head><script type="importmap">{"imports":{"three":"../lib/three/three.module.js","three/addons/":"../lib/three/addons/"}}</script></head>
<body><script type="module">
// Fits the rifle's offset inside mixamorig:RightHand to a set of retargeted rifle animations
// (e.g. a Mesh2Motion export): pistol grip stays in the right palm, handguard points at the left palm,
// optic stays up. Reports how far the left palm is from the handguard before/after.
// ?f=<retargeted glb>&grip=<json with current rifleInHand>
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const q=new URLSearchParams(location.search);
const V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const g=await new GLTFLoader().loadAsync('../'+q.get('f'));
const O0=new THREE.Matrix4().fromArray((await (await fetch('../'+q.get('grip'))).json()).rifleInHand);
const sc=g.scene; sc.updateMatrixWorld(true);
const B={}; sc.traverse(o=>{if(o.isBone)B[o.name.replace('mixamorig','')]=o;});
const t0=V(),q0=new THREE.Quaternion(),s0=V(); O0.decompose(t0,q0,s0);
// palm points in hand-local space (between wrist and middle-finger knuckle)
const palmLocal=(side)=>B[side+'HandMiddle1'].position.clone().multiplyScalar(0.55);
const palmR=palmLocal('Right');
const gripRifle=palmR.clone().applyMatrix4(O0.clone().invert());          // pistol-grip point, rifle space
const leftTarget=V(0,0.17,-0.005);                                           // under the handguard, rifle space
const dLocal=leftTarget.clone().sub(gripRifle).normalize();
const upLocal=V(0,0,-1);                                                     // optic side
const basis=(a,b)=>{const x=a.clone().normalize();const y=b.clone().sub(x.clone().multiplyScalar(b.dot(x))).normalize();return new THREE.Matrix4().makeBasis(x,y,V().crossVectors(x,y));};
const A=basis(dLocal,upLocal), Ainv=A.clone().transpose();
const mixer=new THREE.AnimationMixer(sc);
const frames=[]; // {clip, qHand, R, Lp}
const SKIP=new RegExp(q.get('skip')||'^$','i'), AIMC=new RegExp(q.get('aim')||'Fire','i'), RELC=/reload/i;
for(const clip of g.animations.filter(c=>!SKIP.test(c.name))){
  mixer.stopAllAction(); const act=mixer.clipAction(clip); act.reset().play();
  for(let t=0;t<=clip.duration+1e-6;t+=1/30){
    mixer.setTime(t); sc.updateMatrixWorld(true);
    const R=B.RightHand.matrixWorld.clone();
    const Rp=palmR.clone().applyMatrix4(R);
    const Lp=B.LeftHand.localToWorld(palmLocal('Left'));
    const d=Lp.clone().sub(Rp); const dist=d.length();
    const Rq=B.RightHand.getWorldQuaternion(new THREE.Quaternion());
    const Bw=basis(d,V(0,1,0));
    const Q=new THREE.Quaternion().setFromRotationMatrix(Bw.multiply(Ainv));
    const qHand=Rq.clone().invert().multiply(Q);
    frames.push({clip:clip.name,t,qHand,R,Lp,dist,valid:dist>0.18&&dist<0.8});
  }
}
// average per clip (equal weight per clip), sign-aligned
const clips=[...new Set(frames.map(f=>f.clip))];
const acc=new THREE.Vector4(); let ref=null; const perClip={};
for(const c of clips){
  const fs=frames.filter(f=>f.clip===c&&f.valid); if(!fs.length) continue;
  const cv=new THREE.Vector4();
  for(const f of fs){ ref=ref||f.qHand; const s=Math.sign(f.qHand.dot(ref))||1; cv.x+=f.qHand.x*s;cv.y+=f.qHand.y*s;cv.z+=f.qHand.z*s;cv.w+=f.qHand.w*s; }
  cv.multiplyScalar(1/fs.length); acc.add(cv); perClip[c]={valid:fs.length,total:frames.filter(f=>f.clip===c).length};
}
const qAvg=new THREE.Quaternion(acc.x,acc.y,acc.z,acc.w).normalize();
// translation: keep the pistol grip in the palm
const S=new THREE.Matrix4().compose(V(),qAvg,s0);
const tNew=palmR.clone().sub(gripRifle.clone().applyMatrix4(S));
const O1=new THREE.Matrix4().compose(tNew,qAvg,s0);
// evaluation: left palm vs handguard, in metres
const evalO=(O)=>{const out={};for(const c of clips){const fs=frames.filter(f=>f.clip===c);const rad=[],along=[],ang=[];
  for(const f of fs){const F=f.R.clone().multiply(O);const lp=f.Lp.clone().applyMatrix4(F.clone().invert());const ws=new THREE.Vector3().setFromMatrixScale(F).x;
    rad.push(Math.hypot(lp.x,lp.z-(-0.005))*ws); along.push(lp.y*ws);
    ang.push(THREE.MathUtils.radToDeg(2*Math.acos(Math.min(1,Math.abs(f.qHand.dot(qAvg))))));}
  const med=a=>{const s=[...a].sort((x,y)=>x-y);return +s[Math.floor(s.length/2)].toFixed(3)};const mx=a=>+Math.max(...a).toFixed(3);
  out[c]={leftPalmToHandguard_med_m:med(rad),max_m:mx(rad),alongBarrel_med_m:med(along),angleDev_med_deg:+med(ang).toFixed(1)};}
  return out;};
// ---- refine: aimed Rifle Fire points straight ahead with optic up; left palm near the handguard; optic up everywhere
const fwdW=V(0,0,1).applyQuaternion(sc.getWorldQuaternion(new THREE.Quaternion())); // character forward
const segDist=(lp)=>{const y=THREE.MathUtils.clamp(lp.y,0.02,0.33);return Math.hypot(lp.x,lp.y-y,lp.z+0.005);};
const makeO=(qq)=>{const S=new THREE.Matrix4().compose(V(),qq,s0);return new THREE.Matrix4().compose(palmR.clone().sub(gripRifle.clone().applyMatrix4(S)),qq,s0);};
const sub=frames.filter((f,i)=>i%2===0);
const cost=(qq)=>{const O=makeO(qq);let c=0;const per={};
  for(const f of sub){const F=f.R.clone().multiply(O);const ws=new THREE.Vector3().setFromMatrixScale(F).x;const Fi=F.clone().invert();
    const lp=f.Lp.clone().applyMatrix4(Fi);const d=segDist(lp)*ws;
    const rq=new THREE.Quaternion();F.decompose(V(),rq,V());const barrel=V(0,1,0).applyQuaternion(rq),optic=V(0,0,-1).applyQuaternion(rq);
    let k=0; if(!RELC.test(f.clip)) k+=Math.min(d,0.3); else k+=0.3*Math.min(d,0.3);
    if(AIMC.test(f.clip)) k+=0.35*barrel.angleTo(fwdW);
    k+=0.12*Math.max(0,0.8-optic.y);
    per[f.clip]=(per[f.clip]||0)+k/sub.filter(x=>x.clip===f.clip).length;}
  for(const k in per)c+=per[k];return c;};
let best=qAvg.clone(),bc=cost(best);
for(const step of [0.4,0.2,0.1,0.05,0.025,0.012]){let improved=true;let it=0;
  while(improved&&it++<12){improved=false;
    for(const ax of [V(1,0,0),V(0,1,0),V(0,0,1)])for(const sg of [1,-1]){const cand=best.clone().multiply(new THREE.Quaternion().setFromAxisAngle(ax,step*sg));const cc=cost(cand);if(cc<bc-1e-6){bc=cc;best=cand;improved=true;}}}}
const O2=makeO(best);
const fireAim=(()=>{const fs=frames.filter(f=>AIMC.test(f.clip));let a=0,u=0;for(const f of fs){const rq=new THREE.Quaternion();f.R.clone().multiply(O2).decompose(V(),rq,V());a+=THREE.MathUtils.radToDeg(V(0,1,0).applyQuaternion(rq).angleTo(fwdW));u+=V(0,0,-1).applyQuaternion(rq).y;}return {barrelVsForward_deg:+(a/fs.length).toFixed(1),opticUp_dot:+(u/fs.length).toFixed(2)};})();
window.RESULT={perClip,before:evalO(O0),after:evalO(O1),refined:evalO(O2),fireAim,rifleInHand:O2.toArray()};
window.READY=true;
</script></body></html>
