<!doctype html><html><head><script type="importmap">{"imports":{"three":"../lib/three/three.module.js","three/addons/":"../lib/three/addons/"}}</script></head>
<body style="margin:0;background:#fff"><script type="module">
// Dev tool: shows the children of one node, each in its own colour, in that node's local frame.
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
const q=new URLSearchParams(location.search);
const r=new THREE.WebGLRenderer({antialias:true});r.setSize(900,400);document.body.appendChild(r.domElement);
const s=new THREE.Scene();s.background=new THREE.Color(0xffffff);s.add(new THREE.HemisphereLight(0xffffff,0x888888,3));
const cam=new THREE.PerspectiveCamera(35,900/400,0.01,100);
const l=new GLTFLoader();l.setMeshoptDecoder(MeshoptDecoder);
l.load('../assets/models/'+q.get('m')+'.glb',g=>{
 const node=g.scene.getObjectByName(q.get('n'));
 const cols=[0xff3030,0x30a030,0x3060ff,0xffa000,0xa030ff,0x00c0c0];
 const grp=new THREE.Group();
 node.children.forEach((c,i)=>{const m=new THREE.Mesh(c.geometry,new THREE.MeshStandardMaterial({color:cols[i%6]}));m.position.copy(c.position);m.quaternion.copy(c.quaternion);m.scale.copy(c.scale);grp.add(m);
   const d=document.createElement('div');d.textContent=c.name;d.style.cssText='font:16px sans-serif;color:#'+cols[i%6].toString(16).padStart(6,'0');document.body.appendChild(d);});
 s.add(grp);
 // view along local X (rifle side), Y to the right
 cam.position.set(1.3,0,0);cam.up.set(0,0,1);cam.lookAt(0,0,0);r.render(s,cam);window.READY=true;
});
</script></body></html>
